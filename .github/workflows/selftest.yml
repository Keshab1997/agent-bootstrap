name: Bootstrap selftest

# agent-bootstrap's own CI (Keshab-approved 2026-11-20): the auth tooling and
# Captain tools must not rot silently. Offline only — selftest.py uses fake
# credentials and local git fixtures; no secrets are referenced here.

on:
  push:
    branches: [main]
    paths:
      - 'gh_app.py'
      - 'device_pair.py'
      - 'selftest.py'
      - 'setup.sh'
      - 'captain_up.sh'
      - 'captain/**'
      - '.github/workflows/selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Tool smoke (compile, bash -n, ledger roundtrip, CLI help)
        run: |
          set -eu
          python3 -m py_compile gh_app.py device_pair.py selftest.py captain/*.py
          bash -n setup.sh captain_up.sh
          python3 captain/ledger.py --file /tmp/L.json upsert \
            --repo keshab1997/example --batch b1 --worker A --task t1 --status assigned
          python3 captain/ledger.py --file /tmp/L.json checkpoint \
            --repo keshab1997/example --batch b1 --worker A --task t1 \
            --sha 0000000000000000000000000000000000000000 --status verified
          python3 captain/ledger.py --file /tmp/L.json show
          python3 captain/ledger.py --file /tmp/L.json show --json >/dev/null
          python3 captain/batch_status.py --help >/dev/null
          python3 captain/ci_dispatch.py --help >/dev/null
          python3 captain/task_spec.py --help >/dev/null

      - name: Offline auth/Fast-Lane selftest
        run: python3 selftest.py
